<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title-11 desc-11">
  <title id="title-11">We Didn't Prove Better English. We Made Reading More Workable.</title>
  <desc id="desc-11">Scope and limitations. §7.3 and §8 on p. 11</desc>
  <defs>
