  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" stroke="none" stroke-width="1.6" rx="0" />
  <text x="112" y="158" font-family="Arial, Helvetica, sans-serif" font-size="76" fill="#17232D" font-weight="400" text-anchor="start" xml:space="preserve">We Didn’t Prove Better English.</text>
  <text x="112" y="249" font-family="Arial, Helvetica, sans-serif" font-size="76" fill="#17232D" font-weight="400" text-anchor="start" xml:space="preserve">We Made Reading More Workable.</text>
  <text x="112" y="430" font-family="Arial, Helvetica, sans-serif" font-size="44" fill="#248765" font-weight="700" text-anchor="start" xml:space="preserve">What we observed</text>
  <text x="1040" y="430" font-family="Arial, Helvetica, sans-serif" font-size="44" fill="#17232D" font-weight="700" text-anchor="start" xml:space="preserve">Open questions</text>
  <text x="112" y="550" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#17232D" font-weight="400" text-anchor="start" xml:space="preserve">Faster reading</text>
  <text x="112" y="670" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#17232D" font-weight="400" text-anchor="start" xml:space="preserve">Fewer lookups</text>
  <text x="112" y="790" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#17232D" font-weight="400" text-anchor="start" xml:space="preserve">Higher reported engagement</text>
  <text x="1040" y="550" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#17232D" font-weight="400" text-anchor="start" xml:space="preserve">Long-term language gains</text>
  <text x="1040" y="670" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#17232D" font-weight="400" text-anchor="start" xml:space="preserve">Other languages</text>
  <text x="1040" y="790" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#17232D" font-weight="400" text-anchor="start" xml:space="preserve">Other genres and devices</text>
</svg>