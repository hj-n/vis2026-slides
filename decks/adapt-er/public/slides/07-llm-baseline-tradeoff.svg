  <text x="1040" y="636" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#66717A" font-weight="400" text-anchor="start" xml:space="preserve">mean unfamiliar-word ratio</text>
  <text x="1040" y="755" font-family="Arial, Helvetica, sans-serif" font-size="83" fill="#2771C9" font-weight="700" text-anchor="start" xml:space="preserve">3.4 s</text>
  <text x="1040" y="804" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#66717A" font-weight="400" text-anchor="start" xml:space="preserve">mean completion time per article</text>
  <text x="1040" y="904" font-family="Arial, Helvetica, sans-serif" font-size="39" fill="#17232D" font-weight="700" text-anchor="start" xml:space="preserve">Fast, but off target</text>
