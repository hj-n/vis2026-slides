<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hyeon Jeon's four IEEE VIS 2026 presentations.">
  <title>VIS 2026 Presentations · Hyeon Jeon</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #17232d; font-family: Arial, Helvetica, sans-serif; }
    main { max-width: 1000px; margin: 0 auto; padding: 80px 40px 48px; }
    .conference { margin: 0 0 16px; color: #2771c9; font-weight: 700; font-size: 18px; }
    h1 { margin: 0 0 22px; font-size: clamp(40px, 6vw, 64px); line-height: 1.08; letter-spacing: -.035em; }
    .author { margin: 0 0 58px; color: #59636b; font-size: 18px; line-height: 1.6; }
    nav { border-top: 1px solid #dce1e5; }
    a { display: grid; grid-template-columns: 48px 1fr 28px; align-items: center; gap: 18px; padding: 28px 0; border-bottom: 1px solid #dce1e5; color: inherit; text-decoration: none; }
    .number { color: #69737b; font-size: 16px; font-variant-numeric: tabular-nums; }
    .title { font-size: clamp(22px, 3vw, 30px); font-weight: 700; line-height: 1.3; }
    .arrow { font-size: 28px; text-align: right; }
    a:hover .title, a:focus-visible .title { color: #2771c9; text-decoration: underline; text-underline-offset: 5px; }
    a:focus-visible { outline: 3px solid #2771c9; outline-offset: 6px; }
    @media (max-width: 600px) {
      main { padding: 48px 24px 32px; }
      .author { margin-bottom: 36px; }
      a { grid-template-columns: 28px 1fr 22px; gap: 12px; padding: 25px 0; }
    }
  </style>
</head>
<body>
  <main>
    <p class="conference">IEEE VIS 2026</p>
    <h1>Presentations</h1>
    <p class="author">Hyeon Jeon · Aarhus University</p>
    <nav aria-label="Presentation slides">
      <a href="./visauto/#/1"><span class="number" aria-hidden="true">01</span><span class="title">Visualization Autocomplete</span><span class="arrow" aria-hidden="true">↗</span></a>
      <a href="./dab/#/1"><span class="number" aria-hidden="true">02</span><span class="title">Distortion-aware Brushing</span><span class="arrow" aria-hidden="true">↗</span></a>
      <a href="./misuse/#/1"><span class="number" aria-hidden="true">03</span><span class="title">Stop Misusing t-SNE and UMAP</span><span class="arrow" aria-hidden="true">↗</span></a>
      <a href="./umato/#/1"><span class="number" aria-hidden="true">04</span><span class="title">UMATO</span><span class="arrow" aria-hidden="true">↗</span></a>
    </nav>
  </main>
</body>
</html>
